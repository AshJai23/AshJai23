name: SmartInvest research checks
on:
  push:
    branches: [main]
    paths:
      - 'projects/smartinvest-ai/**/*.py'
      - 'projects/smartinvest-ai/pyproject.toml'
      - 'projects/smartinvest-ai/requirements.lock.txt'
      - 'projects/smartinvest-ai/examples/**'
      - 'projects/smartinvest-ai/browser-demo/dist/**'
      - '.github/workflows/smartinvest-tests.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/smartinvest-ai
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install tested dependencies
        run: |
          python -m pip install -r requirements.lock.txt
          python -m pip install --no-build-isolation --no-deps -e .
          python -m pip check
      - name: Run research prototype tests
        run: python -m pytest -q
      - name: Check browser source assets and JavaScript
        run: |
          python browser-demo/verify_source.py
          node --check browser-demo/dist/app.js
