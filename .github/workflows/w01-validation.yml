name: W01 workflow and evaluation validation
on:
  push:
    branches: [main]
    paths:
      - 'projects/weekly/w01-uk-retail-genai-copilot/**/*.py'
      - 'projects/weekly/w01-uk-retail-genai-copilot/requirements*.txt'
      - 'projects/weekly/w01-uk-retail-genai-copilot/web/**'
      - 'projects/weekly/w01-uk-retail-genai-copilot/DATA_CONTRACT.md'
      - 'projects/weekly/w01-uk-retail-genai-copilot/evaluation/**'
      - '.github/workflows/w01-validation.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    if: github.event.repository.private == false
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/weekly/w01-uk-retail-genai-copilot
    env:
      OMP_NUM_THREADS: '2'
      MKL_NUM_THREADS: '2'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install bounded-workflow dependencies
        run: python -m pip install -r requirements-api.txt
      - name: Test, rebuild real source and replay gates
        run: python ci_validate.py

      - name: Validate frozen quality references without model inference
        run: python validate_quality_contract.py
      - name: Explicit BM25 API HTTP smoke without model generation
        run: python smoke_http.py --baseline
      - name: Check web client JavaScript
        run: node --check web/app.js
